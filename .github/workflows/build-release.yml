name: Build & Sign Release APK

on:
  workflow_dispatch:
    inputs:
      custom_package_name:
        description: '临时自定义包名（留空使用默认包名）'
        required: false
        default: 'com.github.lonepheasantwarrior.talkify'
 # push:
 #   tags:
 #     - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------------------
      # 需求 1 & 2：修改包名，并修复 ABI Filters 与 splits 的冲突
      # -------------------------------------------------------------
      - name: Apply CI Modifications (Package Name & ABI Filters)
        run: |
          # 1. 自定义包名处理
          NEW_APP_ID="${{ github.event.inputs.custom_package_name }}"
          if [ -z "$NEW_APP_ID" ]; then
            NEW_APP_ID="com.github.lonepheasantwarrior.talkify"
          fi
          echo "Using applicationId: $NEW_APP_ID"
          sed -i -E "s/applicationId = \".*\"/applicationId = \"$NEW_APP_ID\"/" app/build.gradle.kts

          # 2. 仅保留 arm64-v8a：
          # 核心修复：注释掉 ndk 下的 abiFilters，避免与 splits.abi 冲突
          echo "Disabling ndk.abiFilters to avoid conflict with splits..."
          sed -i -E 's/(.*abiFilters \+=.*)/\/\/ \1/' app/build.gradle.kts

          # 配置 splits 仅构建 arm64-v8a，且不构建 universal 包
          echo "Configuring splits for arm64-v8a only..."
          sed -i -E 's/include\(.*\)/include("arm64-v8a")/' app/build.gradle.kts
          sed -i -E 's/isUniversalApk = true/isUniversalApk = false/' app/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 仅构建 release 变体（此时只编译并打包 arm64-v8a）
      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      # -------------------------------------------------------------
      # 需求 3：CI 流程签名（使用官方 apksigner）
      # -------------------------------------------------------------
      - name: Sign APK with apksigner
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 1. 解码还原签名证书
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          # 2. 找到生成的未签名 arm64-v8a APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -type f -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: arm64-v8a APK not found!"
            exit 1
          fi
          echo "Found unsigned APK: $UNSIGNED_APK"
          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"

          # 3. 定位 SDK 中的 apksigner 工具
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # 4. 执行 V2/V3 签名
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # 5. 验证签名完整性
          "$APKSIGNER" verify -v "$SIGNED_APK"

          # 6. 清理证书和中间产物
          rm -f release.keystore
          rm -f "$UNSIGNED_APK"

      # 上传签名后的最终 APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Talkify-arm64-v8a-Signed
          path: app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
